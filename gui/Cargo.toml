[package]
name = "yk_ffi_gui"
version = "0.1.0"
edition = "2021"
description = "Native GUI engine used by the Yidika gui std module"
license = "MIT"
repository = "https://github.com/yidika-lab/yidika"

[lib]
name = "yk_ffi_gui"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

<div class="mx-auto grid max-w-[1440px] gap-x-12 px-4 md:px-10 lg:grid-cols-[232px_minmax(0,1fr)] xl:grid-cols-[232px_minmax(0,760px)_208px] xl:justify-center">
  <aside class="sidenav sticky top-[calc(var(--header)+env(safe-area-inset-top,0px))] hidden max-h-[calc(100dvh-var(--header))] self-start overflow-y-auto overscroll-contain py-10 pr-3 lg:block" aria-label="Documentation">{{nav}}</aside>
  <main id="main" class="min-w-0 pt-6 pb-20 lg:pt-10">
    <details class="mb-6 rounded-md border border-rule bg-surface lg:hidden">
      <summary class="flex min-h-11 cursor-pointer items-center gap-2 px-4 font-semibold">{{icon:list}}Documentation</summary>
      <nav class="sidenav border-t border-rule px-4 py-4" aria-label="Documentation">{{nav}}</nav>
    </details>
    <article class="doc-content">{{content}}</article>
  </main>
  <aside class="hidden xl:block" aria-label="On this page">
    <div class="sticky top-[calc(var(--header)+env(safe-area-inset-top,0px))] max-h-[calc(100dvh-var(--header))] overflow-y-auto py-10">{{toc}}</div>
  </aside>
</div>

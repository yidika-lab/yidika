[package]
name = "yidi"
version = "0.4.0"
edition = "2021"
description = "Compiler, interpreter and toolchain for the Yidika programming language"
license = "MIT"
repository = "https://github.com/yidika-lab/yidika"
readme = "README.md"
keywords = ["language", "compiler", "interpreter", "llvm"]
categories = ["compilers", "development-tools"]

[workspace]
members = ["gui"]

[[bin]]
name = "yidi"
path = "src/main.rs"

[dependencies]
stacker = "0.1.25"
fastrand = "2"
rustc-hash = "2"
notify = "8.2"
ctrlc = { version = "3.5", features = ["termination"] }
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
base64 = "0.22"
regex = "1"
toml = { version = "0.7", features = ["preserve_order"] }
libloading = "0.8"
sysinfo = "0.33"
crossbeam-deque = "0.8"
ureq = "3"
sha2 = "0.10"
semver = "1"
tar = { version = "0.4", default-features = false }
flate2 = "1"
tokio = { version = "1", features = ["full"] }
httparse = "1"
bytes = "1"
num_cpus = "1"
percent-encoding = "2"
yk_ffi_gui = { path = "gui" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "interpret"
harness = false


[package]
name = "yidi"
version = "0.1.0"
edition = "2021"
description = "Compiler, interpreter and toolchain for the Yidika programming language"
license = "MIT"
repository = "https://github.com/yidika-lab/yidika"
readme = "README.md"
keywords = ["language", "compiler", "interpreter", "llvm"]
categories = ["compilers", "development-tools"]

[workspace]
members = ["gui"]

[[bin]]
name = "yidi"
path = "src/main.rs"

[dependencies]
fastrand = "2"
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
regex = "1"
toml = "0.7"
libloading = "0.8"
sysinfo = "0.33"
crossbeam-deque = "0.8"
ureq = "3"
tokio = { version = "1", features = ["full"] }
httparse = "1"
bytes = "1"
num_cpus = "1"
percent-encoding = "2"
yk_ffi_gui = { path = "gui" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "interpret"
harness = false


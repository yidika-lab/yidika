name: Feature request
description: Propose a language, std library or tooling feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is painful? Show the code you have to write now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed syntax or API
      render: rust
    validations:
      required: true
  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: How Rust, TypeScript, Swift, Kotlin or another language handles this, with links.
  - type: checkboxes
    id: parity
    attributes:
      label: Scope
      options:
        - label: I understand the feature must work in both the interpreter and the native build, on every target.
          required: true

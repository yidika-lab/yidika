name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rules:
    name: Release rules (RELEASING.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches the Cargo.toml version
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}" >&2
            exit 1
          fi

      - name: Tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "${GITHUB_REF_NAME} points at a commit that is not on main" >&2
            exit 1
          fi

      - name: CHANGELOG.md has a dated section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}] - YYYY-MM-DD' section" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: rules
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin,       os: macos-latest }
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }} -p yidi -p yk_ffi_gui

      - name: Package
        shell: bash
        run: |
          name="yidi-${{ matrix.target }}"
          out="target/${{ matrix.target }}/release"
          mkdir -p "dist/${name}"
          cp LICENSE README.md "dist/${name}/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "${out}/yidi.exe" "${out}/yk_ffi_gui.dll" "${out}/yk_ffi_gui.dll.lib" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
            archive="${name}.zip"
          else
            cp "${out}/yidi" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            archive="${name}.tar.gz"
          fi
          cd dist
          if command -v sha256sum > /dev/null; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: yidi-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [${version}]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes.md
          test -s notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Yidika ${GITHUB_REF_NAME}" \
            --notes-file notes.md

  install-smoke:
    name: Install smoke test (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install with install.sh
        if: runner.os != 'Windows'
        shell: bash
        env:
          YIDI_VERSION: ${{ github.ref_name }}
        run: |
          sh install.sh
          echo "$HOME/.yidi/bin" >> "$GITHUB_PATH"

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          YIDI_VERSION: ${{ github.ref_name }}
        run: |
          ./install.ps1
          Add-Content $env:GITHUB_PATH (Join-Path $HOME '.yidi\bin')

      - name: Run a program with the installed binary
        shell: bash
        run: |
          yidi --version | grep -q "yidi ${GITHUB_REF_NAME#v}"
          printf 'fn main() {\n    print("smoke ok");\n}\n' > smoke.yk
          yidi smoke.yk | grep -q "smoke ok"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format (report only, issue #2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Report formatting backlog
        shell: bash
        run: |
          files=$( (cargo fmt --all --check -l || true) | sort -u | wc -l)
          echo "Files not formatted: ${files} (tree-wide backlog, issue #2)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$files" -gt 0 ]; then
            echo "::warning title=Formatting backlog::${files} files differ from cargo fmt; not caused by this change, see issue #2"
          fi

  style:
    name: Style (no AI-tell characters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject em dashes, curly quotes, ellipses, arrows and invisible spaces
        shell: bash
        run: |
          pattern='[\x{2013}\x{2014}\x{2018}\x{2019}\x{201C}\x{201D}\x{2026}\x{2190}\x{2192}\x{21D2}\x{00D7}\x{00A0}\x{200B}\x{200D}\x{FEFF}]'
          if git grep -nIP "$pattern" -- . ':!AGENTS.md'; then
            echo "::error title=AI-tell characters::Replace the characters above, see AGENTS.md 'Writing and design style'"
            exit 1
          fi

  clippy:
    name: Clippy (gui crate, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p yk_ffi_gui --all-targets -- -D warnings

  clippy-workspace:
    name: Clippy (workspace, report only, issue #14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Report lint backlog
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --message-format=short 2> clippy.txt || true
          lints=$(grep -cE '^[^ ]+:[0-9]+:[0-9]+: (warning|error)' clippy.txt || true)
          echo "Clippy findings: ${lints} (workspace backlog, issue #14)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$lints" -gt 0 ]; then
            echo "::warning title=Clippy backlog::${lints} findings in the workspace; not caused by this change, see issue #14"
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --lib --bins -- --skip compat
      - run: cargo run --quiet --bin yidi -- --version

  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest release into a clean HOME and open a new shell
        shell: bash
        run: |
          home="$(mktemp -d)"
          HOME="$home" SHELL=/bin/bash sh install.sh | tee first.log
          grep -q "self-test passed: Hello from Yidika!" first.log
          HOME="$home" SHELL=/bin/bash sh install.sh
          test "$(grep -c '.yidi/bin' "$home/.bashrc")" = 1
          HOME="$home" bash -c 'source "$HOME/.bashrc"; yidi --version'

  installer-windows:
    name: Installer (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest release and use yidi in the same session
        shell: pwsh
        run: |
          ./install.ps1 | Tee-Object -Variable log
          if (-not ($log -match 'self-test passed: Hello from Yidika!')) { throw 'self-test line missing' }
          yidi --version

  aot-compat:
    name: Interpreter/AOT parity (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p yk_ffi_gui --release
      - run: cargo test --lib compat -- --test-threads=1

  audit:
    name: Security audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
